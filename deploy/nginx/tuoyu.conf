# 备选方案：不用 Caddy、改用宿主机 Nginx + certbot 时使用。
# 1) compose 中去掉 caddy 服务，给 backend 加 ports: ["127.0.0.1:8000:8000"]
# 2) 前端静态文件：cd frontend && npm ci && npm run build，拷贝 dist/ 到 /var/www/tuoyu
# 3) certbot --nginx -d app.example.com 申请证书（会自动改写 ssl_certificate 两行）
server {
    listen 80;
    server_name app.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /metrics { return 404; }

    location ~ ^/(api|u|privacy|public)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ~ ^/(healthz|livez|readyz)$ { proxy_pass http://127.0.0.1:8000; }

    root /var/www/tuoyu;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    # 询盘组件访客页允许被客户官网 iframe 嵌入（来源白名单在后端按组件校验）；location 内 add_header 会覆盖 server 级，故重写安全头
    location ^~ /w/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        try_files $uri /index.html;
    }
    location / { try_files $uri /index.html; }
}
