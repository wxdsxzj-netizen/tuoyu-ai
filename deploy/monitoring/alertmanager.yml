# 示例：告警发到企业微信 / 钉钉 / 飞书机器人需要 webhook 适配器；这里给出通用 webhook 与邮件两种模板，按需取消注释。
# 注意：启用邮件接收器会产生真实对外邮件，需要你确认后再配置。
route: { receiver: default, group_wait: 30s, group_interval: 5m, repeat_interval: 4h }
receivers:
  - name: default
    # webhook_configs: [{ url: "https://你的告警机器人地址" }]
    # email_configs: [{ to: "ops@你的域名", from: "alert@你的域名", smarthost: "smtp.example.com:587", auth_username: "...", auth_password: "..." }]
