# 生产编排（单机 4C8G）：docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod up -d
# 只有 caddy 对外暴露 80/443；数据库、Redis、后端都只在内部网络。
x-backend: &backend
  build: ./backend
  image: tuoyu-backend:${APP_VERSION:-latest}
  env_file: [deploy/.env.prod]
  environment:
    TL_ENV: prod
    TL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    TL_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    TL_UPLOAD_DIR: /data/uploads
    TL_LOG_JSON: "true"
  volumes: [uploads:/data/uploads]
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}" }
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=3GB", "-c", "max_connections=100", "-c", "work_mem=16MB"]
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/backups]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"], interval: 10s, retries: 10 }
    restart: unless-stopped
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"], interval: 10s, retries: 10 }
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    restart: unless-stopped

  migrate:  # 一次性：数据库迁移 + 同步系统角色权限
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.admin sync-roles"]
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }

  backend:
    <<: *backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-l", "info", "--concurrency", "3", "--max-tasks-per-child", "200"]
    healthcheck: { test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME -t 10 | grep -q pong"], interval: 60s, timeout: 20s, retries: 3 }
    depends_on: { backend: { condition: service_started } }

  beat:  # 定时任务只能有一个实例
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    healthcheck: { disable: true }
    depends_on: { backend: { condition: service_started } }

  caddy:
    build: { context: ./frontend, dockerfile: Dockerfile.prod }
    image: tuoyu-web:${APP_VERSION:-latest}
    environment: { APP_DOMAIN: "${APP_DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}" }
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddydata:/data, caddyconfig:/config]
    depends_on: [backend]
    restart: unless-stopped

  # ---- 可选：监控（docker compose --profile monitoring ...），只监听本机 127.0.0.1，通过 SSH 隧道访问 ----
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes: [./deploy/monitoring:/etc/prometheus:ro, promdata:/prometheus]
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: [./deploy/monitoring:/etc/alertmanager:ro]
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped
  node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.8.2
    pid: host
    volumes: ["/:/host:ro,rslave", "/var/lib/node_exporter/textfile:/textfile:ro"]
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/textfile"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
  caddydata:
  caddyconfig:
  promdata:
