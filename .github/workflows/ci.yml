name: CI
on:
  push: { branches: [main, master, "fix/audit-*"] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: tl, POSTGRES_PASSWORD: tl, POSTGRES_DB: tradeleads_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tl" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TL_SECRETS_FILE: /dev/null
      TL_DATABASE_URL: postgresql+psycopg://tl:tl@localhost:5432/tradeleads_test
      TL_REDIS_URL: redis://localhost:6379/0
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim poppler-utils
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: 迁移可从零执行
        run: alembic upgrade head
      - run: python -m app.admin eval
      - run: pytest -q -p no:cacheprovider
      - name: 备份预检及隔离数据库恢复演练
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: tl
          PGPASSWORD: tl
          RESTORE_TEST_REDIS_URL: redis://127.0.0.1:6379/1
          RESTORE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          export RESTORE_DOCKER_BIN="$(command -v docker)"
          mkdir -p "$RUNNER_TEMP/restore-pg"
          for tool in pg_dump pg_restore psql; do
            cat > "$RUNNER_TEMP/restore-pg/$tool" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec "$RESTORE_DOCKER_BIN" exec -i -e PGPASSWORD -e PGUSER "$RESTORE_POSTGRES_CONTAINER" "$(basename "$0")" "$@"
          WRAPPER
            chmod +x "$RUNNER_TEMP/restore-pg/$tool"
          done
          export RESTORE_PG_BIN="$RUNNER_TEMP/restore-pg"
          python -m unittest discover -s deploy/tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=1
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: 校验生产编排
        run: cp deploy/.env.prod.example deploy/.env.prod && docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod config -q
      - name: 构建生产镜像（不推送）
        run: |
          docker build -t tuoyu-backend:ci backend
          docker build -t tuoyu-web:ci -f frontend/Dockerfile.prod frontend
      - name: 备份监控规则回归
        run: docker run --rm -v "$PWD/deploy/monitoring:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v2.54.1 test rules alerts.test.yml
      - name: 脚本语法
        run: for f in deploy/scripts/*.sh; do bash -n "$f"; done
