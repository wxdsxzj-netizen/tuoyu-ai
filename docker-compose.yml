# 本地开发环境：docker compose up --build
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_USER: tl, POSTGRES_PASSWORD: tl, POSTGRES_DB: tradeleads }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tl"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      TL_DATABASE_URL: postgresql+psycopg://tl:tl@postgres:5432/tradeleads
      TL_REDIS_URL: redis://redis:6379/0
      TL_UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker -B -l info --concurrency 2
    env_file: [.env]
    environment:
      TL_DATABASE_URL: postgresql+psycopg://tl:tl@postgres:5432/tradeleads
      TL_REDIS_URL: redis://redis:6379/0
      TL_UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on: { backend: { condition: service_started } }
  frontend:
    build: ./frontend
    environment: { VITE_API_PROXY: "http://backend:8000" }
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
  uploads:
